services:
  - type: web
    name: trademind-api
    runtime: node
    region: singapore # Closest to India (IST market hours)
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard (Neon connection string)
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set this to your Vercel URL after deploying frontend
      - key: PORT
        value: "5000"
